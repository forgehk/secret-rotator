[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-rotator"
version = "0.1.0"
description = "Rotate API keys across providers with snapshot-and-rollback safety."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "@forgehk" }]
keywords = ["security", "devsecops", "secret-rotation", "key-management"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Security",
]
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
secret-rotator = "secret_rotator.cli:main"

[tool.setuptools.packages.find]
include = ["secret_rotator*"]
